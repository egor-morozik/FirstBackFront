<!DOCTYPE html>
<html>
<head>
    <title>Мой первый фронтенд</title>
</head>
<body>
    <h1>Привет из моего API!</h1>
    <div id="data">Здесь будут данные...</div>
    <script>
        fetch('http://localhost:8000/api/items/')  
            .then(response => response.json())
            .then(data => {
                document.getElementById('data').innerHTML = JSON.stringify(data);
            })
            .catch(error => {
                console.error('Ошибка:', error);
            });
    </script>
</body>
</html>
